# Opt-in standalone Azure worker: codex --profile azure-astra
model = "gpt-6-astra"
model_provider = "azure_astra"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
service_tier = "default"
web_search = "disabled"
developer_instructions = """
Complete only the bounded task assigned by the parent. Inspect relevant evidence,
distinguish verified facts from inference, and return concise findings with source
paths or links and unresolved uncertainty. Do not send outreach, submit forms,
accept agreements, spend money, commit, push, or change account settings. Do not
spawn further workers. Do not reveal credentials. Read-only research, drafting,
and code review are the default; return proposed edits rather than modifying files.
"""
[model_providers.azure_astra]
name = "Azure Astra via existing LiteLLM gateway"
base_url = "https://llm.aipodcast.ing/v1"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 1
stream_max_retries = 1
[model_providers.azure_astra.auth]
command = "/bin/sh"
args = ["-c", 'exec python3 "$HOME/GitHub/agents/codex/scripts/azure-astra-token.py"']

[features]
hooks = false

[agents]
enabled = false
